name: Publish Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/faber-ui/package.json"
      - "packages/faber-ui/bun.lock"
      - "crates/**"
      - "packages/faber-ui/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  UI_IMAGE: ui
  API_IMAGE: api

jobs:
  ui:
    name: Build and push UI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/faber-ui/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/ui:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui


