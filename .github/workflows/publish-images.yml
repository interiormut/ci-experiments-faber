name: Publish Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: API image (Cargo incremental target cache)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo target cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-gnu-musl-release-v1
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-gnu-musl-release-v1
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev pkg-config musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build API and agent incrementally
        env:
          CARGO_INCREMENTAL: 1
        run: |
          mkdir -p image-context
          cargo build --release --locked -p api
          cp target/release/api image-context/faber-api
          RUSTFLAGS='-C target-feature=+crt-static -C relocation-model=static' \
            CC_x86_64_unknown_linux_musl=musl-gcc \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release --locked --target x86_64-unknown-linux-musl -p faber-agent
          cp target/x86_64-unknown-linux-musl/release/faber-agent image-context/faber-agent-x86_64
          strip image-context/faber-agent-x86_64
      - name: Show build outputs
        run: |
          du -sh target image-context
          file image-context/faber-api image-context/faber-agent-x86_64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image-context
          file: crates/api/Dockerfile.experiment-sccache
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
