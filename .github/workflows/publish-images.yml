name: Publish Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: Build and push API image (parallel local sccache)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev pkg-config musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build API and agent concurrently
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: 0
        run: |
          mkdir -p image-context
          env -u RUSTFLAGS cargo build --release --locked -p api > /tmp/api-build.log 2>&1 &
          api_pid=$!
          RUSTFLAGS='-C target-feature=+crt-static -C relocation-model=static' \
            CC_x86_64_unknown_linux_musl=musl-gcc \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release --locked --target x86_64-unknown-linux-musl -p faber-agent > /tmp/agent-build.log 2>&1 &
          agent_pid=$!
          api_status=0; agent_status=0
          wait "$api_pid" || api_status=$?
          wait "$agent_pid" || agent_status=$?
          cat /tmp/api-build.log /tmp/agent-build.log
          test "$api_status" -eq 0 && test "$agent_status" -eq 0
          cp target/release/api image-context/faber-api
          cp target/x86_64-unknown-linux-musl/release/faber-agent image-context/faber-agent-x86_64
          strip image-context/faber-agent-x86_64
          cp crates/api/Dockerfile.experiment-sccache image-context/Dockerfile
          sccache --show-stats
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image-context
          file: image-context/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
