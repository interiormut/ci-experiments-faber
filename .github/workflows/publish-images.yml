name: Publish Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    name: Build API binary (sccache)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev pkg-config
      - name: Build API
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: ""
        run: |
          cargo build --release --locked -p api
          mkdir -p image-context
          cp target/release/api image-context/faber-api
      - uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: image-context/faber-api
          retention-days: 1

  build-agent:
    name: Build agent binary (sccache)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build agent
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: -C target-feature=+crt-static -C relocation-model=static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p faber-agent
          mkdir -p image-context
          cp target/x86_64-unknown-linux-musl/release/faber-agent image-context/faber-agent-x86_64
          strip image-context/faber-agent-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: agent-binary
          path: image-context/faber-agent-x86_64
          retention-days: 1

  package-and-push:
    name: Package and push API image
    needs: [build-api, build-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-binary
          path: image-context
      - uses: actions/download-artifact@v4
        with:
          name: agent-binary
          path: image-context
      - run: chmod +x image-context/faber-api image-context/faber-agent-x86_64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image-context
          file: crates/api/Dockerfile.experiment-sccache
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
