[package]
name = "api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/main.rs"

[features]
# Compiles TestProvider in. Never enable for a production build — see
# `build_auth_provider`, which still requires SURGE_TEST_PROVIDER=true on top.
test-provider = ["surge/test-provider"]

[dependencies]
# The run path: `harness` brings deno_core (and therefore V8) into this
# binary, which is what an in-process harness run costs.
llm = { path = "../llm" }
harness = { path = "../harness" }
environment = { path = "../environment" }
search = { path = "../search" }
axum = { version = "0.8", features = ["macros", "ws"] }
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"
url = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.2", features = [
  "postgres",
  "chrono",
  "uuid",
  "serde_json",
] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
diesel_migrations = "2"
bb8 = "0.8"
uuid = { version = "1", features = ["serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
russh = "0.62.6"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
thiserror = "1"
secrecy = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
surge = { git = "https://github.com/panitdev/surge", rev = "37b17b8fad3093eb8ed633b21016659ccdf6c4b3", features = [
  "router",
] }

[dev-dependencies]
# Only for test doubles of `environment`'s object-safe traits: the crate
# itself never implements one.
async-trait = "0.1"
