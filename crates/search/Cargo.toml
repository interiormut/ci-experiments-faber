[package]
name = "search"
version = "0.1.0"
edition = "2024"

# A leaf crate: no `llm`, no `harness`, no `environment`. Web search is a
# capability a workflow hands to a harness, not something that knows about
# runs, exchanges, or targets.
[dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
