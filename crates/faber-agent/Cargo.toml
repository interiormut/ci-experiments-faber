[package]
name = "faber-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "faber-agent"
path = "src/main.rs"

# One dependency family with `environment`'s SSH client half — the
# server side of the same two crates, not a second SSH implementation to
# keep in sync.
[dependencies]
russh = "0.62.6"
russh-sftp = "2.4.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
# Default features would switch rustls' `aws_lc_rs` provider on alongside the
# `ring` one selected below, and rustls refuses to pick a process-level default
# when both are compiled in — every TLS dial panicked.
tokio-rustls = { version = "0.26", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
futures = "0.3"
bytes = "1"
http = "1"
# rustls rather than the default native-tls: openssl reached this binary
# through nothing but reqwest's default features, and dropping it both
# removes the one C dependency standing between this crate and a static musl
# build, and reuses the TLS stack the outbound WebSocket leg already carries.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"

# `geteuid` to refuse a system install that is not root, and `statvfs` for
# the filesystem read the API's admission check asks this daemon for —
# neither has a std equivalent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
