[package]
name = "faber-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "faber-agent"
path = "src/main.rs"

# One dependency family with `environment`'s SSH client half (X40) — the
# server side of the same two crates, not a second SSH implementation to
# keep in sync.
[dependencies]
russh = "0.62.6"
russh-sftp = "2.4.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
futures = "0.3"
bytes = "1"
http = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
