[package]
name = "environment"
version = "0.1.0"
edition = "2024"

# No `llm`, no `harness`. Nothing here may reference a run, a session, or
# an exchange; binding is the consumer's concern and its foreign keys point
# this direction.
[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
russh = "0.62.6"
russh-sftp = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
thiserror = "1"
tokio = { version = "1", features = [
  "process",
  "fs",
  "io-util",
  "time",
  "rt",
  "sync",
  "macros",
  "net",
] }
tracing = "0.1"

# Only for `kill(2)` in the local target: `tokio::process::Child` can send
# SIGKILL and nothing else, and process signals are in scope.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
